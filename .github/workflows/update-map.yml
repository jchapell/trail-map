name: Update trail map

on:
  schedule:
    - cron: "17 * * * *"        # every hour (GitHub may run it a few minutes late)
  workflow_dispatch:             # adds a "Run workflow" button for on-demand updates
  push:
    paths:                       # rebuild right away when you replace the trail file or script
      - "osmp_trails.geojson"
      - "tracker.py"

permissions:
  contents: write                # lets the workflow save the new map back to the repo

concurrency:
  group: trail-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Build map from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python tracker.py

      - name: Publish map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Update trail map"
            git pull --rebase
            git push
          fi
